name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install package
        run: pip install -e . --no-deps

      - name: Build toolbox exes
        run: pyinstaller --workpath build_output/work --distpath build_output/dist specs/toolbox.spec

      - name: Assemble toolbox folder
        run: |
          New-Item -ItemType Directory -Path build_output/toolbox | Out-Null
          Copy-Item build_output\dist\vrlab_toolbox\* build_output\toolbox -Recurse

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        run: |
          # Keeps the "v" prefix (github.ref_name is the raw tag, e.g. "v0.7.2") so the
          # installer filename matches build.ps1's local `git describe --tags` naming, which
          # also keeps it -- e.g. VRLabToolboxSetup-v0.7.2.exe either way.
          $version = "${{ github.ref_name }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" toolbox_installer.iss "/DMyAppVersion=$version"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/installer/*.exe
          generate_release_notes: true
