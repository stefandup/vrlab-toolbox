[build-system]
requires = ["setuptools>=61", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "vrlab-toolbox"
dynamic = ["version", "dependencies"]
description = "VRLab toolbox for VR physiology and behavioural data processing."
license = { file = "LICENSE.md" }
authors = [
    { name = "Stefan du Plessis" },
    { name = "Suzette Schulenburg" },
]

[project.urls]
Repository = "https://github.com/stefandup/vrlab-toolbox"

[tool.setuptools_scm]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.scripts]
vrlab_crane_convert_to_bids = "vrlab_toolbox.cli.crane_convert_to_bids:main"
vrlab_crane_generate_sample_data = "vrlab_toolbox.cli.crane_generate_sample_data:main"
vrlab_foh_import_to_bids = "vrlab_toolbox.cli.foh_import_to_bids:main"
vrlab_foh_generate_sample_data = "vrlab_toolbox.cli.foh_generate_sample_data:main"
vrlab_foh_assess_data = "vrlab_toolbox.cli.FOH_assess_data:main"
vrlab_foh_bids_crosscheck = "vrlab_toolbox.gui.foh_bids_crosscheck_gui:main"
vrlab_foh_process_GUI = "vrlab_toolbox.gui.foh_process_results_gui:main"
vrlab_foh_process = "vrlab_toolbox.cli.vrlab_foh_process:main"
vrlab_plot_target_data = "vrlab_toolbox.cli.plot_subject_target_scr_bars:main"
vrlab_crane_bids_crosscheck = "vrlab_toolbox.gui.crane_bids_crosscheck_gui:main"
vrlab_crane_process = "vrlab_toolbox.cli.vrlab_crane_process:main"
vrlab_crane_process_GUI = "vrlab_toolbox.gui.crane_process_results_gui:main"
vrlab_longwalk_convert_to_bids = "vrlab_toolbox.cli.longwalk_convert_to_bids:main"
vrlab_longwalk_generate_sample_data = "vrlab_toolbox.cli.longwalk_generate_sample_data:main"
vrlab_longwalk_bids_crosscheck = "vrlab_toolbox.gui.longwalk_bids_crosscheck_gui:main"
vrlab_longwalk_process = "vrlab_toolbox.cli.vrlab_longwalk_process:main"
vrlab_longwalk_process_GUI = "vrlab_toolbox.gui.longwalk_process_results_gui:main"
vrlab_toolbox_launcher = "vrlab_toolbox.gui.toolbox_launcher:main"
vrlab_check_xdf = "vrlab_toolbox.cli.check_xdf:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"